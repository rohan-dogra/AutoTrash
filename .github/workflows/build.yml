name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed for the jar version

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: AutoTrash
          path: build/libs/AutoTrash-*.jar

  # The release jar is built against one API version. Compile it against the
  # oldest and newest supported Paper APIs to catch anything missing or removed.
  api-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "1.20.6 (oldest)"
            paper: "1.20.6-R0.1-SNAPSHOT"
            java: 21
          - name: "26.3 (newest)"
            paper: "26.3.build.+"
            java: 25
    name: api-compat ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew compileJava "-PpaperApi=${{ matrix.paper }}" -PjavaVersion=${{ matrix.java }}
